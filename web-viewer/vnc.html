<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Remote Control — Lock Screen</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #16161a;
      --border: #26262c;
      --text: #e8e8ea;
      --muted: #85858c;
      --accent: #34d399;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior: none;
      overflow: hidden;
    }

    /* ── Status screen (shown until the VNC session is connected) ──────── */
    #statusScreen {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
      text-align: center;
    }
    #statusScreen h1 { font-size: 18px; font-weight: 600; }
    #statusScreen p { font-size: 14px; color: var(--muted); max-width: 300px; line-height: 1.5; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #statusError { color: var(--danger); font-size: 13px; display: none; }
    #retryBtn {
      display: none;
      background: var(--accent);
      color: #0a0a0c;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
    }

    /* ── VNC screen ──────────────────────────────────────────────────── */
    #vncScreen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
      background: #000;
    }
    #vncScreen.active { display: block; }
    #vncContainer { width: 100%; height: 100%; }

    #vncTopBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 10px) 12px 8px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }
    #vncDisconnectBtn {
      background: rgba(248,113,113,0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
    }
    #vncLabel {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4);
      padding: 4px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="statusScreen">
    <div class="spinner" id="spinner"></div>
    <h1>Lock-Screen Control</h1>
    <p id="statusText">Connecting…</p>
    <p id="statusError"></p>
    <button id="retryBtn">Try Again</button>
    <!-- TEMP-DEBUG: visible event trail to help diagnose the "stuck after
         entering password" issue on real devices. Remove once resolved. -->
    <pre id="debugLog" style="margin-top:16px;font-size:10px;color:#888;text-align:left;max-width:320px;white-space:pre-wrap;word-break:break-all;"></pre>
  </div>

  <div id="vncScreen">
    <div id="vncTopBar">
      <span id="vncLabel">Lock-screen mode</span>
      <button id="vncDisconnectBtn">Disconnect</button>
    </div>
    <div id="vncContainer"></div>
  </div>

  <script type="module" src="vnc.js"></script>
</body>
</html>
