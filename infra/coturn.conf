# coturn configuration template for Remote Control
#
# Deploy location: /etc/turnserver.conf (replace the existing file)
# After editing the placeholders below, restart with:
#   sudo systemctl restart coturn
#
# Placeholders to replace:
#   YOUR_DOMAIN           -> e.g. remote.example.com
#   YOUR_PUBLIC_IP         -> the cloud server's public IPv4 address
#   YOUR_TURN_SECRET       -> generate with: openssl rand -hex 32

# Listening ports (standard TURN/STUN ports)
listening-port=3478
tls-listening-port=5349

# Relay port range — must match the inbound firewall/security-group rule
# opened for UDP on the cloud server (see deploy.sh)
min-port=49152
max-port=65535

# Public IP the server is reachable at (critical for NAT'd cloud VMs where
# the instance's internal IP differs from its public IP — without this,
# ICE candidates coturn generates will be unusable)
external-ip=YOUR_PUBLIC_IP

# Use time-limited REST API credentials instead of static user/pass, so the
# signaling server mints short-lived TURN credentials per session rather
# than shipping one long-lived secret to every client (M3 security hardening).
use-auth-secret
static-auth-secret=YOUR_TURN_SECRET
realm=YOUR_DOMAIN

# TLS for TURN-over-TLS (5349) — reuse the same cert Nginx/Let's Encrypt issues
cert=/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

# Disable plain-text credential storage, disable unnecessary features
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Logging
log-file=/var/log/turnserver.log
verbose

# Run as a dedicated unprivileged user (set up by deploy.sh)
proc-user=turnserver
proc-group=turnserver
