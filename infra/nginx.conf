# Nginx reverse proxy template for Remote Control signaling server
#
# Deploy location: /etc/nginx/sites-available/remote-control
# Enable with: sudo ln -s /etc/nginx/sites-available/remote-control /etc/nginx/sites-enabled/
#
# Replace YOUR_DOMAIN before deploying. Certbot (see deploy.sh) will rewrite
# the TLS block automatically on first run — the config below is the
# pre-certificate state; certbot --nginx edits it in place to add SSL.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # certbot --nginx will populate these two lines automatically
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Proxy both the WebSocket signaling connection and the static
    # web-viewer files to the Node.js signaling-server process (it serves
    # both from the same port — see signaling-server/index.js).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WebSocket connections alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
